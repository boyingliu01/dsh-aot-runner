# archlint 架构约束配置
#
# 由 xp-gate Gate 6（架构验证）读取。xp-gate 要求本文件存在才会放行提交。
#
# 为什么写这份配置而不是加 .architecture-skip 跳过：
#   Gate 6 在缺配置时直接 BLOCK 而不是静默跳过 —— 这是对的，因为
#   「没有约束」和「约束通过」是两件不同的事。写一份诚实的配置，
#   让本项目的架构违规真的能被拦住，比跳过有意义。
#
# archlint 0.16.0 的已知限制（实测）：
#   - 只分析 JS/TS，**不解析 C#**。所以 src/*.cs（本项目主体）是盲区。
#     这一条记在 docs/XP-GATE-BASELINE.md 的「诚实限制清单」里。
#   - 只查循环依赖 / 上帝模块 / 代码克隆 / 复杂度 / 死代码，不强制分层规则。
#   - 没有「入口点」概念，所以直接执行的脚本会被 dead_code 误判为死代码。

ignore:
  # ---- 测试与夹具 ----
  - '**/*.test.ts'
  - '**/*.test.js'
  - '**/*.spec.ts'
  - '**/*.spec.js'
  - '**/__tests__/**'
  - '**/__mocks__/**'
  - '**/test/**'
  - '**/tests/**'
  - '**/__fixtures__/**'
  - '**/*.mock.ts'
  - '**/*.mock.js'

  # ---- 一次性实验脚本 ----
  # bench/node-tuning/ 是「验证某个 Node 调优参数有没有用」的一次性探针。
  # 每个脚本都是独立的小实验，彼此刻意重复（同一套计时/统计样板）。
  # 把它们抽成公共库会掩盖「每个实验自包含」这个事实，反而降低可信度 ——
  # 读者要能一眼看完一个实验的全部代码，不需要来回跳转。
  # 实测：53 个 smell 里 47 个来自这个目录。
  - 'bench/node-tuning/**'

  # ---- 直接执行的入口脚本 ----
  # 这几个文件是被 shell / npm scripts / eslint 直接调用的**入口**（有 shebang
  # 或由工具按路径加载），不是被别人 import 的模块。archlint 判死代码的依据是
  # 「有没有被 import」，对入口点必然误报。逐个列出而不是整类忽略，
  # 保证将来真新增的孤儿模块仍会被检出来。
  - 'scripts/check-version.mjs'
  - 'scripts/coverage-summary.py'
  - 'eslint.config.mjs'

  # ---- 非源码 / 生成物 ----
  - '.git/**'
  - 'node_modules/**'
  - 'vendor/**'
  - 'dist/**'
  - 'bin/**'
  - 'obj/**'
