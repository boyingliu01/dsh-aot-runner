name: Release

# 发布流程：打 tag → 构建 → 验证 → 发布 GitHub Release（含二进制）+ npm 包
#
# 为什么二进制必须随 Release 发布（而不是只在 npm 包里）：
#
#   1. **从 git clone 的人拿不到 exe**。`*.exe` 被 .gitignore 排除（构建产物不入库），
#      而 NativeAOT 构建需要 .NET SDK + **MSVC 链接器**（VS C++ 工作负载，约 8GB）。
#      要求每个用户为「用一个快 60% 的 runner」装一整套 C++ 工具链是不合理的。
#      Release 附件是这些人唯一的获取途径。
#
#   2. **可审计**。Release 资产有独立的 SHA256 校验和，用户能在下载后核对，
#      不依赖 npm 的 tarball 完整性；同时 CI 构建比本机构建更可信（环境可复现）。
#
#   3. **npm 包把 exe 塞在 tarball 里**，用户看不到单独的文件、也没法只下二进制
#      而不装插件（比如手动丢进 PATH 或做 PATH 之外的自定义部署）。
#
# 触发：推 v* tag。发布前会跑完整门禁，任一失败即中止 —— 宁可不发，不发错的。

on:
  push:
    tags: ['v*']
  # 手动重发时只在「Tag」标签页选一个已有的 tag 触发，**不接受任何文本输入**。
  #
  # 为什么不用 workflow_dispatch inputs 传 tag（原设计，已被 Gate 7 否决）：
  # checkov 规则 CKV_GHA_7 要求 workflow_dispatch 的 inputs 必须为空，理由是
  # 用户可自由填写的参数一旦参与构建，就等于「谁能触发 workflow，谁就能决定
  # 发出去的东西叫什么、装什么」。具体到本工作流：tag 名会进入 zip 文件名、
  # 版本一致性断言、Release 标题 —— 一个手填的字符串可以绕过「tag 必须等于
  # VERSION」这道唯一的版本闸门。
  #
  # 改为只认 github.ref_name（trigger 时的 ref 名），权限收敛到「只能发已有的 tag」。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # id-token: write 是 Trusted Publishing（OIDC）的前提：
  # 有了它，action 才能请求 GitHub 签发 OIDC token 去换 npm 发布权，
  # 从而完全不需要把 npm token 存进仓库 secret。
  id-token: write

jobs:
  verify-and-release:
    name: 构建 · 验证 · 发布
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url 让 setup-node 写好 .npmrc 的 registry 与 authToken 占位，
          # npm publish 才知道往哪发。OIDC 模式下 authToken 实际不用。
          registry-url: 'https://registry.npmjs.org'

      # ---- 0. 版本一致性：tag 与三个版本号文件必须完全对齐 ----
      # 这一项放在最前面，是因为「tag 是 v0.2.0 但包里写 0.1.0」这种事故
      # 一旦发到 npm 就**无法撤回**（只能 unpublish 或发新版本掩盖）。
      - name: 版本一致性校验
        shell: bash
        run: |
          node scripts/check-version.mjs
          EXPECTED="${{ github.ref_name }}"
          ACTUAL="v$(cat VERSION)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag ($EXPECTED) 与 VERSION ($ACTUAL) 不一致"
            exit 1
          fi
          echo "版本一致: $ACTUAL"

      # ---- 1. C# 单元测试（构建前跑，快速失败）----
      - name: C# 单元测试
        run: dotnet test tests/DshAotRunner.Tests/DshAotRunner.Tests.csproj

      # ---- 2. 构建 NativeAOT ----
      - name: 构建 NativeAOT (win-x64)
        run: dotnet publish -c Release -r win-x64 -o dist

      - name: 确认产物存在
        shell: pwsh
        run: |
          if (!(Test-Path dist/dsh-aot-runner.exe)) { throw "构建产物缺失" }
          $item = Get-Item dist/dsh-aot-runner.exe
          Write-Host "体积: $($item.Length) 字节"
          Write-Host "SHA256: $((Get-FileHash $item.FullName -Algorithm SHA256).Hash)"
          # 体积哨兵：AOT 产物应在 1.2~1.8MB。异常膨胀通常是误引入了反射/裁剪失效。
          if ($item.Length -lt 1MB -or $item.Length -gt 3MB) {
            throw "产物体积异常: $($item.Length) 字节（预期 1.2~1.8MB）"
          }

      # ---- 3. 依赖检查：不得依赖 VC++ / .NET 运行时 ----
      # 这是「能不能分发给陌生人」的硬条件：一旦有 vcruntime140 依赖，
      # 没装 VC++ 可再发行组件的机器会直接启动失败。
      #
      # 定位 dumpbin 不能硬编码 Program Files 路径（2026-11-06 CI 实测踩到）：
      # GitHub windows-latest 上的 VS 装在 Enterprise 版路径下，
      # 而第一版脚本只在 ${env:ProgramFiles(x86)} 里递归找，于是"找不到 dumpbin"
      # 误报成构建问题。改用 vswhere —— 它是 VS 官方的定位工具，
      # 也是 NativeAOT 自己找链接器的方式，两边口径一致才不会出现
      # "构建成功但检查失败"这种自相矛盾。
      - name: 依赖检查
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }

          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere 未能定位 Visual Studio" }
          Write-Host "VS 安装路径: $vsRoot"

          $dumpbin = (Get-ChildItem $vsRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1).FullName
          if (-not $dumpbin) { throw "在 $vsRoot 下找不到 dumpbin.exe" }
          Write-Host "dumpbin: $dumpbin"

          $out = & $dumpbin /DEPENDENTS dist/dsh-aot-runner.exe 2>&1 | Out-String
          Write-Host $out
          foreach ($bad in @('vcruntime140', 'msvcp140', 'vcruntime140_1', 'coreclr', 'hostpolicy')) {
            if ($out -match $bad) { throw "发现运行时依赖: $bad（分发会失败）" }
          }
          Write-Host "✅ 无 VC++ / .NET 运行时依赖"

      # ---- 4. 回归：A/B 字节级一致性 + IPC 协议 ----
      # ---- 4. 取自 DSH 的 node runner 作为 A/B 基线 ----
      # A/B 验证要有**对照物**：AOT 的输出必须与 node 版逐字节一致。
      # node 版来自 @deepseek-ai/dsh-subprocess-local/lib/runner.js。
      #
      # 这个包没有（也不该）写进本仓库的 dependencies —— 它是被测环境的一部分，
      # 不是本项目的依赖。所以 CI 上必须显式装一份，否则
      # runner-client.js 找不到基线，A/B 直接以"测试环境未就绪"失败。
      # （首轮 Release run 42221500055 就是这么挂的：本机有 DSH 全局安装所以本地永远绿。）
      - name: 安装 DSH subprocess-local（A/B 基线）
        run: |
          # 固定到与开发环境一致的版本，避免上游改动让 A/B 结论漂移
          $ver = "0.2.0-rc.2"
          New-Item -ItemType Directory -Force -Path baseline | Out-Null
          Push-Location baseline
          npm init -y | Out-Null
          npm install "@deepseek-ai/dsh-subprocess-local@$ver" --no-audit --no-fund
          Pop-Location
          $runner = "baseline/node_modules/@deepseek-ai/dsh-subprocess-local/lib/runner.js"
          if (!(Test-Path $runner)) { throw "基线 runner.js 缺失: $runner" }
          Write-Host "基线 runner: $runner"

      - name: A/B 一致性 + IPC 回归
        env:
          AOT_RUNNER: ${{ github.workspace }}\dist\dsh-aot-runner.exe
          DSH_RUNNER: ${{ github.workspace }}\baseline\node_modules\@deepseek-ai\dsh-subprocess-local\lib\runner.js
        run: |
          node --test test/ab-verify.js
          node --test test/ipc-verify.js

      # ---- 5. 打包二进制资产 ----
      # 同时给 .zip（Windows 用户双击就能解压）和裸 .exe（脚本/CI 直接取用），
      # 外加 SHA256SUMS 供校验。
      - name: 打包发布资产
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/dsh-aot-runner.exe release/dsh-aot-runner.exe

          # 附带许可证与说明，避免二进制单独流出时丢失授权信息
          Copy-Item LICENSE release/LICENSE
          Copy-Item README.md release/README.md

          Compress-Archive -Path release/* -DestinationPath "release/dsh-aot-runner-$tag-win-x64.zip"

          # 校验和（对裸 exe 和 zip 都算）
          #
          # 必须写 LF 行尾：PowerShell 的 Set-Content 默认写 CRLF，而
          # Linux/macOS 的 `sha256sum -c SHA256SUMS` 会把行尾的 \r 当作
          # 文件名的一部分，报 "'dsh-aot-runner.exe'$'\r': No such file"。
          # 0.2.1 实测踩到了 —— Windows 用户用 certutil 手动比对没事，
          # 但照着 README 在 Linux 上跑一行校验命令就会失败。
          # 用 WriteAllText + "`n" 强制 LF；用无 BOM 的 UTF8 避免校验工具
          # 把 BOM 当成首个哈希的一部分。
          $lines = @()
          foreach ($f in @("release/dsh-aot-runner.exe", "release/dsh-aot-runner-$tag-win-x64.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $(Split-Path $f -Leaf)"
          }
          $sumPath = Join-Path (Get-Location) "release/SHA256SUMS"
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText($sumPath, $text, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content release/SHA256SUMS
          Get-ChildItem release | Select-Object Name, Length

      # ---- 6. 发布 GitHub Release ----
      # 无论是否跳过 npm，GitHub Release 都要发 —— 它是二进制的**主**交付渠道。
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## 安装

            **方式 A：只想要原生 exe**（不经插件）
            下载 `dsh-aot-runner-${{ github.ref_name }}-win-x64.zip`，解压即得
            `dsh-aot-runner.exe`。校验完整性：

            ```powershell
            Get-FileHash dsh-aot-runner.exe -Algorithm SHA256   # 对照 SHA256SUMS
            ```

            **方式 B：接入 DSH**（推荐）
            ```bash
            npm install -g @boyingliu01/dsh-aot-runner
            ```
            ⚠️ 在 DSH 0.2.0-rc.2 上还需一行上游补丁才能生效，见 README 顶部说明。

            ## 构建信息

            - 目标：`win-x64`，NativeAOT 自包含
            - 无 VC++ 运行时依赖、无 .NET 运行时依赖（已验证）
            - 由 CI 从 tag 对应 commit 构建，可复现
          files: |
            release/dsh-aot-runner-${{ github.ref_name }}-win-x64.zip
            release/dsh-aot-runner.exe
            release/SHA256SUMS
            release/LICENSE

      # ---- 7. 发布 npm 包 ----
      # 放在最后：GitHub Release 是主要交付物（二进制），npm 失败不该回滚已发布的开源版本。
      # 但顺序不能反 —— 若 npm 先成功而 Release 失败，用户会在 npm 上找不到二进制的说明。
      #
      # 发布方式两选一，**优先 OIDC**：
      #
      #   A. Trusted Publishing（OIDC，推荐且已配好）
      #      不需要任何密钥，GitHub 用 OIDC 直接换取npm 发布权。
      #      好处：零密钥、不存在泄露风险、不需要定期轮换 token。
      #      前提：① 包里 package.json 的 repository 指向本仓库（已满足）；
      #            ② npm 网站上该包已配置 Trusted Publisher（绑定本 release.yml）。
      #      注意 npm 的硬限制：**全新包的首个版本无法用 OIDC 发布**，
      #      必须先用 token 发一次，之后 OIDC 才生效。0.2.0 就是那个「首版」。
      #
      #   B. NPM_TOKEN（granular access token，回退）
      #      当 OIDC 不可用（未配置 trusted publisher / 首次发布）时使用。
      #      granular token 有 90 天上限，需要定期轮换 —— 所以只作为过渡。
      #
      # 两个踩过的坑（2026-11-06 实测）：
      #   1. plugin/bin/ 被 .gitignore 排除（构建产物不入库），CI 里 checkout 之后
      #      这个目录根本**不存在**，`Copy-Item ... bin/` 直接报错。
      #      必须先 New-Item -ItemType Directory。
      #   2. NPM_TOKEN secret 没配时 NODE_AUTH_TOKEN 是空串，npm 会报
      #      ENEEDAUTH，而日志里看不出来「是没配 secret」。所以显式提示。
      - name: 发布 npm 包
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          # bin/ 不入库，CI 上必须显式创建
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item ../dist/dsh-aot-runner.exe bin/dsh-aot-runner.exe -Force

          # 确认包内带的正是刚构建的 exe，避免「发出去的包是旧二进制」
          $built = (Get-FileHash bin/dsh-aot-runner.exe -Algorithm SHA256).Hash
          $fresh = (Get-FileHash ../dist/dsh-aot-runner.exe -Algorithm SHA256).Hash
          if ($built -ne $fresh) { throw "bin/ 内的 exe 与本次构建不一致" }
          Write-Host "bin/ 内 exe 校验通过: $built"

          # 判断能否走 OIDC：ACTIONS_ID_TOKEN_REQUEST_URL 由 actions 在
          # permissions.id-token=write 时注入。存在即说明 OIDC 通道已打开。
          if ($env:ACTIONS_ID_TOKEN_REQUEST_URL) {
            Write-Host "检测到 OIDC 通道 —— 尝试 Trusted Publishing 发布"
            npm publish --access public --provenance
            if ($LASTEXITCODE -eq 0) { Write-Host "✅ 已通过 OIDC 发布"; exit 0 }
            Write-Host "::warning::OIDC 发布失败（可能是该包尚未配置 Trusted Publisher）。回退到 NPM_TOKEN。"
          } else {
            Write-Host "未检测到 OIDC 通道（可能是首次发布或未开 id-token 权限）"
          }

          if (-not $env:NODE_AUTH_TOKEN) {
            Write-Host "::warning::既没有 OIDC 也没有 NPM_TOKEN —— 跳过 npm 发布。"
            Write-Host "  GitHub Release（含二进制）已正常发布，不受影响。"
            Write-Host "  需要发 npm 时：优先在 npm 包设置页配 Trusted Publisher（推荐，无需密钥）；"
            Write-Host "  或用 granular access token 配成仓库 secret NPM_TOKEN（90 天需轮换）。"
            exit 0
          }

          npm config set //registry.npmjs.org/:_authToken $env:NODE_AUTH_TOKEN
          npm publish --access public

