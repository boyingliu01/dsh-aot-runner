name: CI

# 设计原则：**优先省 Actions 额度**
#
# 私有仓库免费额度 2000 分钟/月，Windows runner 按 2 倍计费。
# 所以这里做了区分：
#   - ubuntu-latest（1x 计费）：跑所有与平台无关的检查，每次 push 都跑
#   - windows-latest（2x 计费）：只跑构建 + 核心 A/B，且只在手动 / 打 tag 时跑
#
# 如果额度耗尽，GitHub 会直接不调度，工作流显示 queued 或失败，
# 这**不影响本地验证结论** —— 本地 `npm run test:all` 是唯一的发布判据。

# C# 编译严格度的来源（Gate 13 适配器）所在的上游 ref。
#
# 用合并提交的 SHA，而不是分支或 tag：
#   - PR 分支合并后会被删除，指过去等于让 CI 随时失效
#   - 已发布的 npm 包还没有这个函数：包里的 0.37.0 是改动前构建的，
#     上游尚未 bump 版本重新发布（见 xp-gate #781）
#   - SHA 不可变，且删不掉，是此刻唯一稳定且含该实现的引用
#
# 这个值同时是「我们用哪一版严格度标准」的答案 —— 只在这里定义一次。
# 上游合并并发布后改成对应 tag。
env:
  XP_GATE_ADAPTER_REF: c809d918db7a8b398369a11ddf5ceb59e303a42c

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_windows:
        description: '额外跑 Windows 构建 + A/B（消耗 2x 额度）'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 与平台无关的静态检查：便宜（1x），每次必跑 ──────────────────
  lint:
    name: 静态检查（Linux / 1x 计费）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查（全部 JS）
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            echo "check $f"
            node --check "$f" || fail=1
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './bin/*' -not -path './obj/*')
          exit $fail

      - name: ESLint
        run: |
          if [ -f eslint.config.mjs ]; then
            npx --yes eslint@9 . 2>&1 || echo "::warning::ESLint 未通过（见日志）"
          else
            echo "无 eslint 配置，跳过"
          fi

      - name: 文档与清单一致性
        run: |
          set -e
          echo "VERSION: $(cat VERSION)"
          node -e "
            const p=require('./package.json');
            const v=require('fs').readFileSync('VERSION','utf8').trim();
            if (p.version !== v) { console.error('package.json 版本 ' + p.version + ' 与 VERSION ' + v + ' 不一致'); process.exit(1); }
            console.log('版本一致: ' + v);
          "

      - name: 检查是否误提交构建产物
        run: |
          set -e
          bad=$(git ls-files | grep -E '^(bin|obj|dist|coverage|node_modules)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下构建产物被误提交："
            echo "$bad"
            exit 1
          fi
          echo "无构建产物被提交 ✅"

  # ── Windows 构建 + 核心 A/B：贵（2x），手动或打 tag 时才跑 ────────
  build-windows:
    name: Windows 构建 + A/B（2x 计费）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 解析 C# 编译严格度（Gate 13）
        shell: bash
        run: |
          set -e
          # 严格度的唯一来源是 XP-Gate Gate 13 适配器，CI 不另抄一份。
          #
          # 为什么不用已发布的 npm 包：包里的 0.37.0 是改动之前构建的，不含
          # gate13_csharp_flags()（上游 npm-publish 发现有同版本号就跳过了）。
          # 所以直接从上���源码取同一个文件 —— 拿到的就是评审通过的实现本身。
          # 上游 bump 版本重新发布后，可改用包内副本，函数名不变。
          ADAPTER_URL="https://raw.githubusercontent.com/boyingliu01/xp-gate/${XP_GATE_ADAPTER_REF}/githooks/gate-13-compiler-strictness.sh"
          # 不用 $RUNNER_TEMP：Windows runner 给的是反斜杠路径（D:\a\_temp），
          # Git Bash 下 curl -o 会把反斜杠当转义处理，写到的不是预期位置，
          # 后续 grep 自然找不到 —— 而在 Linux 上一切正常，很难察觉。
          ADAPTER="gate13-adapter.sh"
          echo "取适配器: $ADAPTER_URL"
          curl -fsSL "$ADAPTER_URL" -o "$ADAPTER"
          echo "已下载 $(wc -c < "$ADAPTER") 字节"

          # 取到的文件必须真的含有这个函数。没有就失败，绝不退回一组本地默认值 ——
          # 退回等于悄悄降低标准，而这正是收敛到单一来源要避免的事。
          if ! grep -q '^gate13_csharp_flags()' "$ADAPTER"; then
            echo "::error::$ADAPTER_URL 中不含 gate13_csharp_flags()"
            echo "前 5 行实际内容："
            head -5 "$ADAPTER"
            exit 1
          fi

          source "$ADAPTER"
          FLAGS=$(gate13_csharp_flags balanced)
          echo "严格度参数: $FLAGS"
          echo "STRICT_FLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: 构建 NativeAOT
        shell: bash
        run: |
          set -e
          # shellcheck disable=SC2153
          FLAGS="$STRICT_FLAGS"
          # 必须指定 .csproj 而不是 sln：sln + --output 会触发 NETSDK1194
          # （解决方案级输出路径会让多个项目往同一目录复制，产物不确定）。
          # shellcheck disable=SC2086
          dotnet publish DshAotRunner.csproj -c Release -r win-x64 -o dist $FLAGS

      - name: 确认产物存在
        run: |
          if (!(Test-Path dist/dsh-aot-runner.exe)) { throw "构建产物缺失" }
          $s = (Get-Item dist/dsh-aot-runner.exe).Length
          Write-Host "体积: $s 字节"

      - name: 依赖检查（不得依赖 VC++ 运行时）
        shell: pwsh
        run: |
          # 用 vswhere 定位 dumpbin，而不是裸调 `dumpbin` 或硬编码 Program Files 路径。
          # windows-latest 上的 VS 装在 Enterprise 版路径下，硬编码会误报"找不到"；
          # 裸调则依赖 PATH 里恰好有 MSVC bin（不保证）。vswhere 与 NativeAOT
          # 找链接器用的是同一套机制，口径一致才不会出现"构建成功但检查失败"。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere 未能定位 Visual Studio" }
          $dumpbin = (Get-ChildItem $vsRoot -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1).FullName
          if (-not $dumpbin) { throw "在 $vsRoot 下找不到 dumpbin.exe" }

          $out = & $dumpbin /DEPENDENTS dist/dsh-aot-runner.exe 2>&1 | Out-String
          Write-Host $out
          foreach ($bad in @('vcruntime140','msvcp140','vcruntime140_1')) {
            if ($out -match $bad) { throw "发现 VC++ 运行时依赖: $bad（分发会失败）" }
          }
          Write-Host "无 VC++ 运行时依赖 ✅"

      - name: 安装 DSH subprocess-local（A/B 基线）
        shell: bash
        run: |
          # A/B 验证要拿 Node 版 runner 作基线，没装就直接报「测试环境未就绪」。
          # 固定版本，避免上游改动让 A/B 结论漂移。
          VER="0.2.0-rc.2"
          mkdir -p baseline
          cd baseline
          npm init -y > /dev/null
          npm install "@deepseek-ai/dsh-subprocess-local@$VER" --no-audit --no-fund
          cd ..

          # 测试只在仓库根和 DSH_HOME 下找 runner.js，装到 baseline/ 是找不到的。
          # 用 DSH_RUNNER 显式指过去 —— 这是测试自己文档里给出的扩展点。
          # 必须转成 Windows 原生路径：Git Bash 的 $PWD 是 /d/a/... 这种形式，
          # Node.js 在 Windows 上不认，会当成相对路径从而还是找不到。
          # cygpath -w 在 Windows runner 上可用；Linux 上没有这个命令，退回原值。
          RUNNER_JS="$PWD/baseline/node_modules/@deepseek-ai/dsh-subprocess-local/lib/runner.js"
          if command -v cygpath >/dev/null 2>&1; then
            RUNNER_JS=$(cygpath -w "$RUNNER_JS")
          fi
          if [ ! -f "$RUNNER_JS" ]; then
            echo "::error::基线 runner 未安装成功：$RUNNER_JS"
            exit 1
          fi
          echo "DSH_RUNNER=$RUNNER_JS" >> "$GITHUB_ENV"
          echo "A/B 基线: $RUNNER_JS"

      - name: A/B 一致性验证
        # 注意：完整套件含 100 次泄漏回归（约 3 分钟）和竞态（约 3 分钟），
        # 这里只跑核心 A/B 以控制额度消耗。完整套件在本地跑。
        env:
          AOT_RUNNER: ${{ github.workspace }}\dist\dsh-aot-runner.exe
        run: |
          node --test test/ab-verify.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aot-runner-win-x64
          path: dist/dsh-aot-runner.exe
          retention-days: 7
